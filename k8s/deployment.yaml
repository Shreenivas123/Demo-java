apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-java
  labels:
    app: demo-java

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-java

  template:
    metadata:
      labels:
        app: demo-java

    spec:
      containers:
      - name: demo-java
        image: ${IMAGE_NAME}:${IMAGE_TAG}
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
