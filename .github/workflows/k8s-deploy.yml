name: Build, Push & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/demo-java

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      #############################################################
      # Checkout Repository
      #############################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      #############################################################
      # Setup Java
      #############################################################

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      #############################################################
      # Build Maven Project
      #############################################################

      - name: Build WAR
        run: mvn clean package -DskipTests

      #############################################################
      # Docker Login
      #############################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #############################################################
      # Build Docker Image
      #############################################################

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      #############################################################
      # Install kubectl
      #############################################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      #############################################################
      # Configure kubeconfig
      #############################################################

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube

          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

          chmod 600 $HOME/.kube/config

      #############################################################
      # Verify Cluster
      #############################################################

      - name: Verify Kubernetes Cluster
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      #############################################################
      # Install envsubst
      #############################################################

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      #############################################################
      # Replace Variables in deployment.yaml
      #############################################################

      - name: Generate Kubernetes Manifest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < k8s/deployment.yaml > deployment.yaml

          echo "Generated Deployment Manifest"

          cat deployment.yaml

      #############################################################
      # Deploy Application
      #############################################################

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f k8s/service.yaml

      #############################################################
      # Wait for Rollout
      #############################################################

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/demo-java --timeout=300s

      #############################################################
      # Show Deployment Details
      #############################################################

      - name: Show Resources
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc
