name: Build, Push & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/demo-java

jobs:
  build-push-deploy:

    runs-on:
      - self-hosted
      - linux
      - x64

    permissions:
      contents: read

    steps:

      ############################################################
      # Checkout
      ############################################################

      - name: Checkout Source
        uses: actions/checkout@v4

      ############################################################
      # Java
      ############################################################

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      ############################################################
      # Build
      ############################################################

      - name: Build Maven Project
        run: |
          mvn clean package -DskipTests

      ############################################################
      # Docker
      ############################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      ############################################################
      # kubectl
      ############################################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      ############################################################
      # Configure kubeconfig
      ############################################################

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      ############################################################
      # Verify cluster
      ############################################################

      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      ############################################################
      # Install envsubst
      ############################################################

      - name: Install gettext
        run: |
          if ! command -v envsubst &>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

      ############################################################
      # Generate deployment manifest
      ############################################################

      - name: Generate Deployment YAML
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < k8s/deployment.yaml > deployment.yaml

      ############################################################
      # Deploy
      ############################################################

      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f k8s/service.yaml

      ############################################################
      # Wait for rollout
      ############################################################

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/demo-java --timeout=300s

      ############################################################
      # Show resources
      ############################################################

      - name: Show Cluster Resources
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc
